<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reflex // VR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-troika-text@0.14.0/dist/aframe-troika-text.min.js"></script>
  <script src="js/instruction-cards.js"></script>
  <script src="js/environment-neon.js"></script>
  <script src="js/environment-details.js"></script>
  <script src="js/environment-architecture.js"></script>
  <script src="js/vr-interaction.js"></script>
  <script src="js/game-manager.js"></script>
  <script src="js/countdown-voiceover.js"></script>
  <script src="js/ui-manager.js"></script>
  <script src="js/laser-pointer.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/score-manager.js"></script>
  <script src="js/target-orb-visual.js"></script>
  <script src="js/target-spawner.js"></script>
  <script src="js/target-placement-markers.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/grid-floor.js"></script>
  <script src="js/particles.js"></script>
</head>

<body>
  <a-scene game-timer score-manager game-manager hud ui-manager countdown-voiceover>
    <a-assets>
      <a-asset-item id="ethnocentricFont" src="assets/fonts/Ethnocentric-Regular.otf"></a-asset-item>
      <img id="countdown3Texture" src="assets/ui/countdown_3.png" />
      <img id="countdown2Texture" src="assets/ui/countdown_2.png" />
      <img id="countdown1Texture" src="assets/ui/countdown_1.png" />
      <img id="countdownGoTexture" src="assets/ui/countdown_GO.png" />
    </a-assets>

    <!-- Camera rig: a wrapper entity so we can move the "player" later -->
    <a-entity id="rig" position="0 0 0" rotation="0 0 0">
      <a-camera
        position="0 1.6 0"
        look-controls="reverseMouseDrag: false"
        wasd-controls="enabled: false">
      </a-camera>

      <a-entity id="leftHand" hand-controls="hand: left" controller-hand-orientation
        raycaster="objects: .clickable; far: 5; enabled: false; showLine: false; useWorldCoordinates: true"
        cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup"
        tracked-controller-ray="hand: left"
        laser-pointer>
      </a-entity>
      <a-entity id="rightHand" hand-controls="hand: right" controller-hand-orientation
        raycaster="objects: .clickable; far: 5; enabled: false; showLine: false; useWorldCoordinates: true"
        cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup"
        tracked-controller-ray="hand: right"
        laser-pointer>
      </a-entity>

    </a-entity>

    <!-- Ground plane -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#222233"
      grid-floor industrial-floor>
    </a-plane>

    <!-- Environment: placeholder corridor -->
    <a-entity id="environment" target-spawner target-placement-markers particles environment-details architectural-tunnel>

      <!-- Static world-space countdown, centered in front of the initial view. -->
      <a-image
        id="countdownDisplay"
        src="#countdown3Texture"
        position="0 1.6 -2.5"
        width="0.85"
        height="0.85"
        visible="false"
        transparent="true"
        material="shader: flat; transparent: true; alpha-test: 0.01; side: double; opacity: 1">
      </a-image>

      <!-- Left wall -->
      <a-plane
        position="-3 1.5 -2.5"
        rotation="0 90 0"
        width="11"
        height="3"
        color="#0a0a14">
      </a-plane>

      <!-- Right wall -->
      <a-plane
        position="3 1.5 -2.5"
        rotation="0 -90 0"
        width="11"
        height="3"
        color="#0a0a14">
      </a-plane>

      <!-- Ceiling -->
      <a-plane
        position="0 3 -2.5"
        rotation="90 0 0"
        width="6"
        height="11"
        color="#08080f">
      </a-plane>

      <!-- Wall behind the player -->
      <a-plane
        position="0 1.5 3"
        rotation="0 180 0"
        width="6"
        height="3"
        color="#0a0a14">
      </a-plane>

      <!-- Back wall (where the HUD screen-wall will eventually sit) -->
      <!-- Main reaction wall -->
      <a-entity id="reactionWall" position="0 1.5 -8" visible="false">
        <a-plane width="6" height="3" color="#0d0d18"></a-plane>

        <!-- Architectural perimeter sits beyond the unchanged HUD field. -->
        <a-box position="0 1.56 0.025" width="6.24" height="0.10" depth="0.08" color="#172235"></a-box>
        <a-box position="0 -1.56 0.025" width="6.24" height="0.10" depth="0.08" color="#172235"></a-box>
        <a-box position="-3.07 0 0.025" width="0.10" height="3.02" depth="0.08" color="#172235"></a-box>
        <a-box position="3.07 0 0.025" width="0.10" height="3.02" depth="0.08" color="#172235"></a-box>
        <a-box class="environment-neon" env-neon="color: #00c9e8" position="0 1.49 0.105" width="5.72" height="0.014" depth="0.012" color="#008da7"></a-box>
        <a-box class="environment-neon" env-neon="color: #00c9e8" position="0 -1.49 0.071" width="5.72" height="0.014" depth="0.012" color="#008da7"></a-box>
        <a-box class="environment-neon" env-neon="color: #d52bb0" position="-3.00 0 0.071" width="0.014" height="2.82" depth="0.012" color="#8f247f"></a-box>
        <a-box class="environment-neon" env-neon="color: #d52bb0" position="3.00 0 0.071" width="0.014" height="2.82" depth="0.012" color="#8f247f"></a-box>

        <a-image
          id="reactionWallLogo"
          src="assets/images/reflex-vr-logo.png"
          position="0 0.88 0.06"
          width="1.55"
          height="0.48"
          transparent="true">
        </a-image>

        <a-entity
          id="timeLabel"
          troika-text="value: TIME; font: #ethnocentricFont; font-size: 0.19; color: #eafaff; align: center; anchor: center; max-width: 2.2"
          position="0 0.27 0.06">
        </a-entity>

        <a-entity
          id="timerText"
          troika-text="value: 60; font: #ethnocentricFont; font-size: 0.78; color: #00e5ff; align: center; anchor: center; max-width: 2.2"
          position="0 -0.26 0.06">
        </a-entity>

        <a-entity
          id="scoreLabel"
          troika-text="value: SCORE; font: #ethnocentricFont; font-size: 0.17; color: #eafaff; align: center; anchor: center; max-width: 2.0"
          position="-1.8 -0.58 0.06">
        </a-entity>

        <a-entity
          id="scoreText"
          troika-text="value: 000; font: #ethnocentricFont; font-size: 0.32; color: #00e5ff; align: center; anchor: center; max-width: 2.0"
          position="-1.8 -0.98 0.06">
        </a-entity>

        <a-entity
          id="accuracyLabel"
          troika-text="value: ACCURACY; font: #ethnocentricFont; font-size: 0.17; color: #eafaff; align: center; anchor: center; max-width: 2.0"
          position="1.8 -0.58 0.06">
        </a-entity>

        <a-entity
          id="accuracyText"
          troika-text="value: 100%; font: #ethnocentricFont; font-size: 0.32; color: #00e5ff; align: center; anchor: center; max-width: 2.0"
          position="1.8 -0.98 0.06">
        </a-entity>
      </a-entity>

      <!-- Static world-space end-of-round panel. Only Play Again is clickable. -->
      <a-entity id="gameOverPanel" visible="false" scale="0.7 0.7 0.7">
        <a-plane
          id="gameOverPanelBackground"
          width="2.7"
          height="1.75"
          material="shader: flat; color: #050918; transparent: true; opacity: 0.768; side: double">
        </a-plane>
        <a-box position="0 0.875 0.014" width="2.46" height="0.018" depth="0.012" color="#00e5ff"></a-box>
        <a-box position="0 -0.875 0.014" width="2.46" height="0.018" depth="0.012" color="#00e5ff"></a-box>
        <a-box position="-1.35 0 0.014" width="0.018" height="1.51" depth="0.012" color="#ff2fd6"></a-box>
        <a-box position="1.35 0 0.014" width="0.018" height="1.51" depth="0.012" color="#ff2fd6"></a-box>
        <a-torus position="-1.23 0.755 0.014" rotation="0 0 90" radius="0.12" radius-tubular="0.009" arc="90" color="#ff2fd6"></a-torus>
        <a-torus position="1.23 0.755 0.014" rotation="0 0 0" radius="0.12" radius-tubular="0.009" arc="90" color="#ff2fd6"></a-torus>
        <a-torus position="-1.23 -0.755 0.014" rotation="0 0 180" radius="0.12" radius-tubular="0.009" arc="90" color="#ff2fd6"></a-torus>
        <a-torus position="1.23 -0.755 0.014" rotation="0 0 270" radius="0.12" radius-tubular="0.009" arc="90" color="#ff2fd6"></a-torus>

        <a-entity
          id="gameOverTitle"
          troika-text="value: GAME OVER; font: #ethnocentricFont; font-size: 0.2578125; color: #ffffff; align: center; anchor: center; max-width: 2.55; white-space: nowrap"
          position="0 0.55 0.035">
        </a-entity>
        <a-entity
          troika-text="value: SCORE; font: #ethnocentricFont; font-size: 0.14; color: #eafaff; align: center; anchor: center; max-width: 1.1"
          position="-0.62 0.12 0.035">
        </a-entity>
        <a-entity
          troika-text="value: ACCURACY; font: #ethnocentricFont; font-size: 0.14; color: #eafaff; align: center; anchor: center; max-width: 1.3"
          position="0.62 0.12 0.035">
        </a-entity>
        <a-entity
          id="resultScoreText"
          troika-text="value: 000; font: #ethnocentricFont; font-size: 0.28; color: #00e5ff; align: center; anchor: center; max-width: 1.1"
          position="-0.62 -0.2 0.035">
        </a-entity>
        <a-entity
          id="resultAccuracyText"
          troika-text="value: 100%; font: #ethnocentricFont; font-size: 0.28; color: #00e5ff; align: center; anchor: center; max-width: 1.3"
          position="0.62 -0.2 0.035">
        </a-entity>

        <a-entity
          id="playAgainButton"
          class="clickable"
          geometry="primitive: rounded-rect; width: 1.2; height: 0.24; radius: 0.08"
          primary-button-layout="label: #playAgainLabel"
          material="shader: flat; color: #210a30; transparent: true; opacity: 0.98; side: double"
          position="0 -0.61 0.045">
          <a-entity
            id="playAgainLabel"
            troika-text="value: PLAY AGAIN; font: #ethnocentricFont; font-size: 0.14; color: #eafaff; align: center; anchor: center; max-width: 1.2"
            position="0 0 0.02">
          </a-entity>
        </a-entity>
      </a-entity>

      <a-entity id="welcomeScreen" position="0 1.6 -1.5">
        <a-plane
          id="welcomePanelBackground"
          width="1.8"
          height="1.2"
          material="shader: flat; color: #050918; transparent: true; opacity: 0.768; side: double">
        </a-plane>

        <!-- Shared panel frame: cyan horizontal edges, magenta sides and corners. -->
        <a-box position="0 0.6 0.014" width="1.632" height="0.0126" depth="0.012" color="#00e5ff"></a-box>
        <a-box position="0 -0.6 0.014" width="1.632" height="0.0126" depth="0.012" color="#00e5ff"></a-box>
        <a-box position="-0.9 0 0.014" width="0.0126" height="1.032" depth="0.012" color="#ff2fd6"></a-box>
        <a-box position="0.9 0 0.014" width="0.0126" height="1.032" depth="0.012" color="#ff2fd6"></a-box>
        <a-torus position="-0.816 0.516 0.014" rotation="0 0 90" radius="0.084" radius-tubular="0.0063" arc="90" color="#ff2fd6"></a-torus>
        <a-torus position="0.816 0.516 0.014" rotation="0 0 0" radius="0.084" radius-tubular="0.0063" arc="90" color="#ff2fd6"></a-torus>
        <a-torus position="-0.816 -0.516 0.014" rotation="0 0 180" radius="0.084" radius-tubular="0.0063" arc="90" color="#ff2fd6"></a-torus>
        <a-torus position="0.816 -0.516 0.014" rotation="0 0 270" radius="0.084" radius-tubular="0.0063" arc="90" color="#ff2fd6"></a-torus>

        <a-image
          src="assets/images/reflex-vr-logo.png"
          position="0 0.32 0.01"
          width="1.3"
          height="0.4"
          transparent="true">
        </a-image>

        <a-entity
          id="startButton"
          class="clickable"
          geometry="primitive: rounded-rect; width: 0.8; height: 0.18; radius: 0.056"
          primary-button-layout="label: #startButtonLabel"
          material="shader: flat; color: #210a30; transparent: true; opacity: 0.98; side: double"
          position="0 -0.3 0.01">
          <a-entity
            id="startButtonLabel"
            troika-text="value: START GAME; font: #ethnocentricFont; font-size: 0.10; color: #eafaff; align: center; anchor: center; max-width: 0.72; white-space: nowrap"
            position="0 0 0.02">
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Instructions are built from individual spatial A-Frame elements. -->
      <a-entity id="instructionsScreen" position="0 1.6 -1.5" visible="false">
        <a-entity id="instructionsPanel" scale="0.7 0.7 0.7">
          <a-plane
            id="instructionsPanelBackground"
            width="4"
            height="2.25"
            position="0 0 0"
            material="shader: flat; color: #050918; transparent: true; opacity: 0.768; side: double">
          </a-plane>

          <!-- Shared rounded frame language: cyan rails, magenta sides and corners. -->
          <a-box position="0 1.125 0.012" width="3.76" height="0.018" depth="0.012" color="#00e5ff"></a-box>
          <a-box position="0 -1.125 0.012" width="3.76" height="0.018" depth="0.012" color="#00e5ff"></a-box>
          <a-box position="-2 0 0.012" width="0.018" height="2.01" depth="0.012" color="#ff2fd6"></a-box>
          <a-box position="2 0 0.012" width="0.018" height="2.01" depth="0.012" color="#ff2fd6"></a-box>
          <a-torus position="-1.88 1.005 0.014" rotation="0 0 90" radius="0.12" radius-tubular="0.009" arc="90" color="#ff2fd6"></a-torus>
          <a-torus position="1.88 1.005 0.014" rotation="0 0 0" radius="0.12" radius-tubular="0.009" arc="90" color="#ff2fd6"></a-torus>
          <a-torus position="-1.88 -1.005 0.014" rotation="0 0 180" radius="0.12" radius-tubular="0.009" arc="90" color="#ff2fd6"></a-torus>
          <a-torus position="1.88 -1.005 0.014" rotation="0 0 270" radius="0.12" radius-tubular="0.009" arc="90" color="#ff2fd6"></a-torus>

          <a-image
            id="instructionsLogo"
            src="assets/images/reflex-vr-logo.png"
            position="0 0.91 0.035"
            width="0.64"
            height="0.276"
            transparent="true">
          </a-image>
          <a-entity
            id="instructionsTitle"
            position="0 0.61 0.04"
            troika-text="value: HOW TO PLAY; font: #ethnocentricFont; font-size: 0.22; color: #ffffff; align: center; anchor: center; max-width: 2.4; white-space: nowrap">
          </a-entity>

          <!-- Shared native 1:1 card compositions; evenly spaced and centered as a group. -->
          <a-entity
            id="card-01"
            instruction-card="number: 01; heading: LOOK; body: Watch for the glowing targets.; accent: #e83bc5; illustration: look"
            position="-1.275 -0.02 0.04">
          </a-entity>
          <a-entity
            id="card-02"
            instruction-card="number: 02; heading: REACT; body: Hit the target as quickly as you can.; accent: #00dff5; illustration: react"
            position="-0.425 -0.02 0.04">
          </a-entity>
          <a-entity
            id="card-03"
            instruction-card="number: 03; heading: SCORE; body: Every successful hit increases your score.; accent: #e83bc5; illustration: score"
            position="0.425 -0.02 0.04">
          </a-entity>
          <a-entity
            id="card-04"
            instruction-card="number: 04; heading: STAY SHARP; body: Targets appear faster as the game progresses.; accent: #00dff5; illustration: sharp"
            position="1.275 -0.02 0.04">
          </a-entity>

          <!-- Real raycastable button: its background is the target geometry. -->
          <a-entity
            id="instructionStartButton"
            class="clickable"
            geometry="primitive: rounded-rect; width: 1.18; height: 0.22; radius: 0.08"
            primary-button-layout="label: #instructionStartLabel"
            material="shader: flat; color: #210a30; transparent: true; opacity: 0.98; side: double"
            position="0 -0.79 0.045">
            <a-entity id="instructionStartLabel" troika-text="value: LET'S GO!; font: #ethnocentricFont; font-size: 0.13; color: #eafaff; align: center; anchor: center; max-width: 0.76; white-space: nowrap" position="-0.06 0 0.02"></a-entity>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Repeating side-wall bays: broad dark structure, recessed modules, restrained accents. -->
      <a-entity id="leftWallBays">
        <a-box position="-2.78 1.5 -6.7" width="0.32" height="3" depth="0.16" color="#101827"></a-box>
        <a-box position="-2.78 1.5 -3.4" width="0.32" height="3" depth="0.16" color="#101827"></a-box>
        <a-box position="-2.78 1.5 -0.1" width="0.32" height="3" depth="0.16" color="#101827"></a-box>
        <a-box position="-2.78 1.5 2.6" width="0.32" height="3" depth="0.16" color="#101827"></a-box>
        <a-box position="-2.82 0.18 -2.05" width="0.28" height="0.035" depth="8.8" color="#172438"></a-box>
        <a-box position="-2.82 2.82 -2.05" width="0.28" height="0.035" depth="8.8" color="#172438"></a-box>
        <a-box position="-2.59 1.5 -5.05" width="0.035" height="1.45" depth="1.6" color="#0b1220"></a-box>
        <a-box position="-2.59 1.5 -1.75" width="0.035" height="1.45" depth="1.6" color="#0b1220"></a-box>
        <a-box position="-2.59 1.5 1.55" width="0.035" height="1.45" depth="1.6" color="#0b1220"></a-box>
        <a-box position="-2.55 1.5 -5.05" width="0.025" height="1.05" depth="0.035" color="#00a9c8"></a-box>
        <a-box position="-2.55 1.5 1.55" width="0.025" height="0.8" depth="0.035" color="#a52387"></a-box>
        <a-box position="-2.54 1.05 -1.75" width="0.025" height="0.32" depth="1.15" color="#172b3d"></a-box>
        <a-box position="-2.54 1.95 1.55" width="0.025" height="0.32" depth="1.15" color="#172b3d"></a-box>
      </a-entity>
      <a-entity id="rightWallBays">
        <a-box position="2.78 1.5 -6.7" width="0.32" height="3" depth="0.16" color="#101827"></a-box>
        <a-box position="2.78 1.5 -3.4" width="0.32" height="3" depth="0.16" color="#101827"></a-box>
        <a-box position="2.78 1.5 -0.1" width="0.32" height="3" depth="0.16" color="#101827"></a-box>
        <a-box position="2.78 1.5 2.6" width="0.32" height="3" depth="0.16" color="#101827"></a-box>
        <a-box position="2.82 0.18 -2.05" width="0.28" height="0.035" depth="8.8" color="#172438"></a-box>
        <a-box position="2.82 2.82 -2.05" width="0.28" height="0.035" depth="8.8" color="#172438"></a-box>
        <a-box position="2.59 1.5 -5.05" width="0.035" height="1.45" depth="1.6" color="#0b1220"></a-box>
        <a-box position="2.59 1.5 -1.75" width="0.035" height="1.45" depth="1.6" color="#0b1220"></a-box>
        <a-box position="2.59 1.5 1.55" width="0.035" height="1.45" depth="1.6" color="#0b1220"></a-box>
        <a-box position="2.55 1.5 -1.75" width="0.025" height="0.8" depth="0.035" color="#00a9c8"></a-box>
        <a-box position="2.55 1.5 1.55" width="0.025" height="1.05" depth="0.035" color="#a52387"></a-box>
        <a-box position="2.54 1.05 -5.05" width="0.025" height="0.32" depth="1.15" color="#172b3d"></a-box>
        <a-box position="2.54 1.95 -1.75" width="0.025" height="0.32" depth="1.15" color="#172b3d"></a-box>
      </a-entity>

      <!-- Ceiling ribs and recessed channels guide the view toward the reaction wall. -->
      <a-box position="-2.45 2.88 -2.5" width="0.18" height="0.18" depth="9.5" color="#111a2a"></a-box>
      <a-box position="2.45 2.88 -2.5" width="0.18" height="0.18" depth="9.5" color="#111a2a"></a-box>
      <a-box class="environment-neon" env-neon="color: #00c9e8" position="-1.72 2.91 -3.4" width="0.025" height="0.018" depth="6.6" color="#0089a4"></a-box>
      <a-box class="environment-neon" env-neon="color: #00c9e8" position="1.72 2.91 -3.4" width="0.025" height="0.018" depth="6.6" color="#0089a4"></a-box>
      <a-box position="0 2.94 -5.1" width="5.2" height="0.08" depth="0.12" color="#101827"></a-box>

      <!-- Left wall neon strips (vertical) -->
      <a-box class="environment-neon" env-neon="color: #d52bb0" position="-2.88 1.5 -6" width="0.025" height="1.9" depth="0.025" color="#a52387"></a-box>
      <a-box class="environment-neon" env-neon="color: #00c9e8" position="-2.88 1.5 -2" width="0.025" height="1.9" depth="0.025" color="#00a9c8"></a-box>

      <!-- Right wall neon strips (vertical) -->
      <a-box class="environment-neon" env-neon="color: #00c9e8" position="2.88 1.5 -6" width="0.025" height="1.9" depth="0.025" color="#00a9c8"></a-box>
      <a-box class="environment-neon" env-neon="color: #d52bb0" position="2.88 1.5 -2" width="0.025" height="1.9" depth="0.025" color="#a52387"></a-box>

      <!-- Selective bay accents: cyan leads, with one magenta detail per side. -->
      <a-box class="environment-neon" env-neon="color: #00c9e8" position="-2.27 1.5 -5.42" width="0.012" height="0.46" depth="0.018" color="#008da7"></a-box>
